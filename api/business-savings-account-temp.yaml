openapi: 3.0.1
info:
  title: API BS Savings Account Temp V1
  description: "[INGRESAR_AQUI_DESCRIPCION_API]"
  version: 1.0.0
servers:
- url: /business-savings-account-temp/v1
x-bcp-api-type: BS
x-bcp-api-id: savings-account-temp
externalDocs:
  url: [URL-DOCUMENTATION-SEGUN-TIPO-API]
  description: Mas informacion
tags:
  - name: Savings Account
    description: Funcionalidades relacionadas con [INGRESAR_AQUI_DESCRIPCION_ESPANOL_RECURSO].
  - name: Account Transaction
    description: Funcionalidades relacionadas con [INGRESAR_AQUI_DESCRIPCION_ESPANOL_RECURSO].
paths:
  /savings-accounts/initiate:
    post:
      tags:
      - Savings Account
      summary: Consultar el detalle de una cuenta
      description: '[DESCRIPCION_ENDPOINT]'
      operationId: initiateSavingsAccounts
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RequestDataHeader'
      - $ref: '#/components/parameters/AppCodeHeader'
      - $ref: '#/components/parameters/CallerNameHeader'
      - $ref: '#/components/parameters/OcpApimSubscriptionKeyHeader'
      responses:
        '200':
          description: OK
        '201':
          $ref: '#/components/responses/201InitiateSavingsAccountsResponse'
        '202':
          $ref: '#/components/responses/202InitiateSavingsAccountsResponse'
        '400':
          $ref: '#/components/responses/400BadRequestResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/404NotFoundResponse'
        '429':
          $ref: '#/components/responses/429TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/500InternalServerErrorResponse'
        '501':
          $ref: '#/components/responses/501NotImplementedResponse'
        '502':
          $ref: '#/components/responses/502BadGatewayResponse'
        '503':
          $ref: '#/components/responses/503ServiceUnavailableResponse'
        '504':
          $ref: '#/components/responses/504GatewayTimeoutResponse'
  /savings-accounts/retrieve:
    get:
      tags:
      - Savings Account
      summary: ''
      description: '[DESCRIPCION_ENDPOINT]'
      operationId: retrieveSavingsAccounts
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RequestDataHeader'
      - $ref: '#/components/parameters/AppCodeHeader'
      - $ref: '#/components/parameters/CallerNameHeader'
      - $ref: '#/components/parameters/OcpApimSubscriptionKeyHeader'
      responses:
        '200':
          description: OK
        '201':
          $ref: '#/components/responses/201RetrieveSavingsAccountsResponse'
        '202':
          $ref: '#/components/responses/202RetrieveSavingsAccountsResponse'
        '400':
          $ref: '#/components/responses/400BadRequestResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/404NotFoundResponse'
        '429':
          $ref: '#/components/responses/429TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/500InternalServerErrorResponse'
        '501':
          $ref: '#/components/responses/501NotImplementedResponse'
        '502':
          $ref: '#/components/responses/502BadGatewayResponse'
        '503':
          $ref: '#/components/responses/503ServiceUnavailableResponse'
        '504':
          $ref: '#/components/responses/504GatewayTimeoutResponse'
  /savings-accounts/{savingsAccountId}/update:
    put:
      tags:
      - Savings Account
      summary: ''
      description: '[DESCRIPCION_ENDPOINT]'
      operationId: updateSavingsAccount
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RequestDataHeader'
      - $ref: '#/components/parameters/AppCodeHeader'
      - $ref: '#/components/parameters/CallerNameHeader'
      - $ref: '#/components/parameters/OcpApimSubscriptionKeyHeader'
      - $ref: '#/components/parameters/SavingsAccountId'
      responses:
        '200':
          description: OK
        '201':
          $ref: '#/components/responses/201UpdateSavingsAccountResponse'
        '202':
          $ref: '#/components/responses/202UpdateSavingsAccountResponse'
        '400':
          $ref: '#/components/responses/400BadRequestResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/404NotFoundResponse'
        '429':
          $ref: '#/components/responses/429TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/500InternalServerErrorResponse'
        '501':
          $ref: '#/components/responses/501NotImplementedResponse'
        '502':
          $ref: '#/components/responses/502BadGatewayResponse'
        '503':
          $ref: '#/components/responses/503ServiceUnavailableResponse'
        '504':
          $ref: '#/components/responses/504GatewayTimeoutResponse'
  /savings-accounts/{savingsAccountId}/account-transactions/retrieve:
    get:
      tags:
      - Account Transaction
      summary: ''
      description: '[DESCRIPCION_ENDPOINT]'
      operationId: retrieveAccountTransactions
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RequestDataHeader'
      - $ref: '#/components/parameters/AppCodeHeader'
      - $ref: '#/components/parameters/CallerNameHeader'
      - $ref: '#/components/parameters/OcpApimSubscriptionKeyHeader'
      - $ref: '#/components/parameters/SavingsAccountId'
      responses:
        '200':
          description: OK
        '201':
          $ref: '#/components/responses/201RetrieveAccountTransactionsResponse'
        '202':
          $ref: '#/components/responses/202RetrieveAccountTransactionsResponse'
        '400':
          $ref: '#/components/responses/400BadRequestResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/404NotFoundResponse'
        '429':
          $ref: '#/components/responses/429TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/500InternalServerErrorResponse'
        '501':
          $ref: '#/components/responses/501NotImplementedResponse'
        '502':
          $ref: '#/components/responses/502BadGatewayResponse'
        '503':
          $ref: '#/components/responses/503ServiceUnavailableResponse'
        '504':
          $ref: '#/components/responses/504GatewayTimeoutResponse'
components:
  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
    RequestIdHeader:
      name: Request-ID
      in: header
      required: true
      schema:
        type: string
    RequestDataHeader:
      name: request-data
      in: header
      required: true
      schema:
        type: string
    AppCodeHeader:
      name: app-code
      in: header
      required: true
      schema:
        type: string
    CallerNameHeader:
      name: caller-name
      in: header
      required: true
      schema:
        type: string
    OcpApimSubscriptionKeyHeader:
      name: Ocp-Apim-Subscription-Key
      in: header
      required: true
      schema:
        type: string
    SavingsAccountId:
      name: savingsAccountId
      in: path
      required: true
      schema:
        type: string
  schemas:
    InitiateSavingsAccountsCreatedResponse: {}
    InitiateSavingsAccountsAcceptedResponse: {}
    RetrieveSavingsAccountsCreatedResponse: {}
    RetrieveSavingsAccountsAcceptedResponse: {}
    UpdateSavingsAccountCreatedResponse: {}
    UpdateSavingsAccountAcceptedResponse: {}
    RetrieveAccountTransactionsCreatedResponse: {}
    RetrieveAccountTransactionsAcceptedResponse: {}
    Code:
      type: string
      title: Code
      description: Codigo de error de alto, nivel, es el 2do nivel de detalle de un error,
        se basa en el http code devuelto.El formato es ERXXXX, donde XXXX es el numero
        de error.
      maxLength: 6
      example: ER0007
    ErrorType:
      type: string
      title: ErrorType
      enum:
      - Functional
      - Technical
      description: "Tipo de error:\n- Functional - Error devuelto por una validacion o\
        \ regla de \nnegocio no superada\n- Techical - Error devuelto por la herramienta\
        \ o sistema,\ngeneralmente causado por problemas tecnicos o dependencias externas.\n"
      example: Functional
    Description:
      type: string
      title: Description
      description: Descripcion del mensaje de error, alto nivel.
      maxLength: 500
      example: Error al llamar al servicio
    Path:
      type: string
      title: Path
      maxLength: 200
      description: Referencia al path del Json involucrado en el error, aqui se indica
        que objecto del request, response o parametro de consulta es el involucrado con
        el error
      example: Party.partyIdentification.IdentifierValue
    Url:
      type: string
      title: Url
      maxLength: 200
      description: Ubicacion de la documentacion para soporte del problema.
      example: https://documentation-to-fix-error.com/como-consultar-datos-usuario-info
    ApiExceptionDetail:
      type: object
      title: ApiExceptionDetail
      description: Contiene la lista de detalles para mayor detalle del error originado
      example:
        code: TL0001
        description: Error al llamar al servicio
        path: Party.partyIdentification.IdentifierValue
        url: https://documentacion-to-fix-error.com/como-consultar-datos-usuario-info
      properties:
        code:
          $ref: '#/components/schemas/Code'
        description:
          $ref: '#/components/schemas/Description'
        path:
          $ref: '#/components/schemas/Path'
        url:
          $ref: '#/components/schemas/Url'
    ApiException:
      type: object
      title: ApiException
      description: El servicio no recibio una respuesta oportuna de la aplicacion
      example:
        code: ER0007
        description: Error al llamar al servicio
        errorType: Functional
        exceptionDetails:
        - code: TL001
          description: Error al llamar al servicio
          path: Party.part
          url: https://documentation-to-fix-error.com/como-consultar-datos-usuario-info
      properties:
        code:
          $ref: '#/components/schemas/Code'
        errorType:
          $ref: '#/components/schemas/ErrorType'
        description:
          $ref: '#/components/schemas/Description'
        exceptionDetails:
          type: array
          description: Contiene la lista de detalles para mayor detalle del error originado
          items:
            $ref: '#/components/schemas/ApiExceptionDetail'
  responses:
    201InitiateSavingsAccountsResponse:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InitiateSavingsAccountsCreatedResponse'
    202InitiateSavingsAccountsResponse:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InitiateSavingsAccountsAcceptedResponse'
    201RetrieveSavingsAccountsResponse:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetrieveSavingsAccountsCreatedResponse'
    202RetrieveSavingsAccountsResponse:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetrieveSavingsAccountsAcceptedResponse'
    201UpdateSavingsAccountResponse:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateSavingsAccountCreatedResponse'
    202UpdateSavingsAccountResponse:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateSavingsAccountAcceptedResponse'
    201RetrieveAccountTransactionsResponse:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetrieveAccountTransactionsCreatedResponse'
    202RetrieveAccountTransactionsResponse:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetrieveAccountTransactionsAcceptedResponse'
    500InternalServerErrorResponse:
      description: El servicio lanzo algun error. Por favor contactarse con soporte Tecnico.
        Por favor, comuniquese con su administrador.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiException'
    501NotImplementedResponse:
      description: El servicio lanzo algun error. Por favor contactarse con soporte Tecnico.
        Por favor, comuniquese con su administrador.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiException'
    502BadGatewayResponse:
      description: El servicio recibio una respuesta invalida del backend. Por favor intente
        nuevamente mas tarde.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiException'
    504GatewayTimeoutResponse:
      description: El tiempo de espera para recibir una respuesta del  backend ha expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiException'
    400BadRequestResponse:
      description: La solicitud enviada no es valida. Por favor revise los parametros
        o el cuerpo de la peticion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiException'
    401UnauthorizedResponse:
      description: No se pudo autenticar la solicitud. Por favor verifique las credenciales
        proporcionadas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiException'
    404NotFoundResponse:
      description: El recurso solicitado no fue encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiException'
    429TooManyRequestsResponse:
      description: Se supero el limite de solicitudes permitidas. Por favor intente nuevamente
        mas tarde.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiException'
    503ServiceUnavailableResponse:
      description: El servicio no se encuentra disponible en este momento. Por favor intente
        nuevamente mas tarde.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiException'